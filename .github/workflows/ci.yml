on:
  push:
    paths-ignore:
      - ".devcontainer/**"
      - "config/**"
      - "data/**"
      - "README.md"

name: ci

jobs:
  lint:
    env:
      GOPATH: ${{ github.workspace }}

    defaults:
      run:
        working-directory: ${{ env.GOPATH }}/src/github.com/${{ github.repository }}

    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          path: ${{ env.GOPATH }}/src/github.com/${{ github.repository }}
      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version-file: ${{ env.GOPATH }}/src/github.com/${{ github.repository }}/go.mod
          cache-dependency-path: ${{ env.GOPATH }}/src/github.com/${{ github.repository }}/go.sum
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0
      - name: Run golangci-lint
        run: make lint

  test:
    env:
      GOPATH: ${{ github.workspace }}

    defaults:
      run:
        working-directory: ${{ env.GOPATH }}/src/github.com/${{ github.repository }}

    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          path: ${{ env.GOPATH }}/src/github.com/${{ github.repository }}
      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version-file: ${{ env.GOPATH }}/src/github.com/${{ github.repository }}/go.mod
          cache: false
      - name: Test
        run: make test-race
